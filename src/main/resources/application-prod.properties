# ===== Production profile (activate with spring.profiles.active=prod) =====
# HTTPS is opt-in for local/default; this profile enables transport security
# behind a TLS terminator / reverse proxy (X-Forwarded-Proto).

app.security.require-https=${APP_SECURITY_REQUIRE_HTTPS:true}
app.security.hsts-enabled=${APP_SECURITY_HSTS_ENABLED:true}
app.auth.cookie.secure=${APP_AUTH_COOKIE_SECURE:true}

# Optional comma-separated HTTPS frontend origins, e.g. https://app.example.com
# app.security.cors.additional-origins=${APP_SECURITY_CORS_ADDITIONAL_ORIGINS:}
