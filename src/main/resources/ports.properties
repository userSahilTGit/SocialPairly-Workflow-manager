# Single place for process ports.
#
# app.server.port     This API. Dev, preprod, and prod listen here unless
#                     SERVER_PORT or --server.port is set.
# app.frontend.port   Local Vite app. Must match FRONTEND_PORT in
#                     SocialPairly-UI/src/config/ports.js.
#                     Stripe return URLs and email links use
#                     http://localhost:<this> unless APP_FRONTEND_URL is set.
#                     Prod and preprod profiles still default those links to
#                     the public site.
#
# app.server.port must match BACKEND_PORT in SocialPairly-UI/src/config/ports.js.
app.server.port=9012
app.frontend.port=3002
