spring.application.name=SocialPairly-Workflow-Manager

# ===== Environment flags =====
# Restart after changing these. Both false = this file (dev).
# app.prod-flag=true loads application-prod.properties on top of this file.
# app.preprod-flag=true loads application-preprod.properties. Prod wins if both are true.
# Startup overrides, highest first: --app.prod-flag= | -Dapp.prod-flag= | APP_PROD_FLAG
# and the same forms for app.preprod-flag / APP_PREPROD_FLAG.
app.prod-flag=${APP_PROD_FLAG:false}
app.preprod-flag=${APP_PREPROD_FLAG:false}

# PORT
server.port=9010

# ===== Database Configuration (MySQL) =====
spring.datasource.mysql.url=${DB_URL:jdbc:mysql://localhost:3306/socialpairly_test}
spring.datasource.mysql.username=${DB_USERNAME:socialpairly_app}
spring.datasource.mysql.password=${DB_PASSWORD:PlasticSkiesOfBronzeAge@2026Testing}
spring.datasource.mysql.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== Hikari Connection Pool =====
spring.datasource.mysql.hikari.connection-timeout=30000
spring.datasource.mysql.hikari.idle-timeout=600000
spring.datasource.mysql.hikari.max-lifetime=1800000
spring.datasource.mysql.hikari.maximum-pool-size=10
spring.datasource.mysql.hikari.minimum-idle=5
spring.datasource.mysql.hikari.pool-name=SocialPairlyHikariPool

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===== File upload =====
# Customer-care screenshots may be up to 10MB (PNG, JPG, or PDF, max 3 files).
# Profile photos, gallery media, and identity documents stay capped at 5MB in their services.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=32MB
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
app.upload.dir=uploads


# ===== JWT =====
app.jwt.secret=${APP_JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
app.jwt.expiration-ms=86400000
# Remember Me = 30 days
app.jwt.remember-expiration-ms=2592000000

# ===== Auth cookie (HttpOnly; set APP_AUTH_COOKIE_SECURE=true in HTTPS prod) =====
app.auth.cookie.name=SP_AUTH
app.auth.cookie.secure=${APP_AUTH_COOKIE_SECURE:false}
app.auth.cookie.same-site=Lax

# ===== Transport security (leave false for local HTTP; enable in HTTPS prod) =====
# Honor X-Forwarded-* from reverse proxies / load balancers
server.forward-headers-strategy=framework
app.security.require-https=${APP_SECURITY_REQUIRE_HTTPS:false}
app.security.hsts-enabled=${APP_SECURITY_HSTS_ENABLED:false}
app.security.hsts-max-age-seconds=31536000
# Optional comma-separated extra CORS origins (e.g. https://app.socialpairly.com)
app.security.cors.additional-origins=${APP_SECURITY_CORS_ADDITIONAL_ORIGINS:}
# Cookie-session CSRF (Bearer clients are exempt; safe for existing SPA)
app.security.csrf.enabled=${APP_SECURITY_CSRF_ENABLED:true}

# ===== Data encryption at rest (AES-256-GCM for SSN, ID numbers, bank details, ID documents) =====
# Base64 32-byte key, e.g. `openssl rand -base64 32`. Must be set (and kept stable) in every shared environment;
# losing or changing it makes already-encrypted values unreadable.
app.security.data-encryption-key=${APP_DATA_ENCRYPTION_KEY:}
# Widen columns and encrypt legacy plaintext rows on startup (idempotent)
app.security.data-encryption.migrate-on-startup=${APP_DATA_ENCRYPTION_MIGRATE:true}

# ===== Error responses: never expose internals =====
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

# ===== Auth rate limits (single-node in-memory; use Redis for multi-instance) =====
app.rate-limit.window-ms=900000
app.rate-limit.login-max=10
app.rate-limit.register-max=5
app.rate-limit.forgot-send-max=5
app.rate-limit.forgot-verify-max=10
app.rate-limit.verify-email-max=10
app.rate-limit.resend-verification-max=5

# ===== Default admin seed =====
app.admin.email=${APP_ADMIN_EMAIL:admin@socialpairly.com}
app.admin.password=${APP_ADMIN_PASSWORD:Admin@123}

# Dev only: local secrets live in application-local.properties (gitignored).
# Ignored when app.prod-flag or app.preprod-flag is true.
# SPRING_PROFILES_ACTIVE still selects a profile when both flags are false.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ===== Mail =====
# SMTP login = noreply (OTP / system mail From).
# Contact form uses app.support.email as From + shared inbox thread (Reply-To = member).
# In Google Workspace: allow noreply to "Send mail as" customercare@ (or use customercare App Password).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
#spring.mail.username=${MAIL_USERNAME:customercare@socialpairly.com}
#spring.mail.password=${MAIL_PASSWORD:hodh boan uqwn thhd}
spring.mail.username=${MAIL_USERNAME:noreply@socialpairly.com}
spring.mail.password=${MAIL_PASSWORD:dagt evff rcef kmtn}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.from=${MAIL_USERNAME:noreply@socialpairly.com}
# Gmail returns 421 4.3.0 when many SMTP sessions open at once (event fan-out).
# Sends are serialized; this gap and the retry budget absorb the temporary rejection.
app.mail.send-gap-ms=400
app.mail.retry.max-attempts=4
app.mail.retry.initial-backoff-ms=2000

# ===== Phone / SMS =====
# Phone OTP SMS is sent by Firebase Auth on the client.
# Keep default country code for E.164 normalization.
app.sms.default-country-code=+91
app.sms.provider=console

# ===== Firebase Admin (server-side phone token verification) =====
# Service account JSON lives in the repo at config/firebase-service-account.json
app.firebase.enabled=true
app.firebase.credentials-location=file:config/firebase-service-account.json

