spring.application.name=SocialPairly-Workflow-Manager

# PORT
server.port=8080

# ===== Database Configuration (MySQL) =====
spring.datasource.mysql.url=jdbc:mysql://localhost:3306/socialpairly_dev
spring.datasource.mysql.username=socialpairly_app
spring.datasource.mysql.password=PlasticSkiesOfBronzeAge@2026Testing
spring.datasource.mysql.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== Hikari Connection Pool =====
spring.datasource.mysql.hikari.connection-timeout=30000
spring.datasource.mysql.hikari.idle-timeout=600000
spring.datasource.mysql.hikari.max-lifetime=1800000
spring.datasource.mysql.hikari.maximum-pool-size=10
spring.datasource.mysql.hikari.minimum-idle=5
spring.datasource.mysql.hikari.pool-name=SocialPairlyHikariPool

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== File upload (profile photos) =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
app.upload.dir=uploads


