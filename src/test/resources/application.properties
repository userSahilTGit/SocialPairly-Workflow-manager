# ===== Test Database (H2 in MySQL compatibility mode) =====
# Used by any test not explicitly activating the "test" profile.
# Re-points the custom spring.datasource.mysql.* namespace to H2 in-memory.
spring.datasource.mysql.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.mysql.username=sa
spring.datasource.mysql.password=
spring.datasource.mysql.driver-class-name=org.h2.Driver
spring.datasource.mysql.hikari.connection-timeout=30000
spring.datasource.mysql.hikari.idle-timeout=600000
spring.datasource.mysql.hikari.max-lifetime=1800000
spring.datasource.mysql.hikari.maximum-pool-size=2
spring.datasource.mysql.hikari.minimum-idle=1
spring.datasource.mysql.hikari.pool-name=TestHikariPool

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ===== File upload =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=uploads-test

# ===== Disable external moderation API in tests =====
moderatecontent.api-key=

# ===== JWT =====
app.jwt.secret=test-secret-key-for-unit-tests-only-12345678901234567890
app.jwt.expiration-ms=86400000

# ===== Admin seed =====
app.admin.email=admin@socialpairly.com
app.admin.password=Admin@123

# ===== Mail test properties (JavaMailSender bean is required by AuthService) =====
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@example.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===== Stripe (required by PaymentService and CheckoutFulfillmentService) =====
stripe.secretKey=sk_test_placeholder
stripe.publiableKey=pk_test_placeholder
stripe.webhookSecret=whsec_test_placeholder

# ===== Frontend / merchant (Stripe checkout redirect) =====
app.frontend.url=http://localhost:3001
app.email.base-url=https://socialpairly.com
app.merchant.name=SocialPairly
app.support.email=test@example.com

# ===== Logging =====
logging.level.root=WARN
logging.level.org.hibernate=WARN